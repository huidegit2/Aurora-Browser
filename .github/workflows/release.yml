name: Build and Release FPK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "fnpack.json"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号；留空自动递增（例如 1.0.24）"
        required: false
        type: string
      dry_run:
        description: "只构建验证，不创建 Release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: fpk-release
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('app/server/package-lock.json') }}

      - name: Static checks
        run: |
          for f in app/server/*.js; do node --check "$f"; done
          python3 -c "import json; d=json.load(open('fnpack.json',encoding='utf-8')); assert d['schema_version']=='2'"
          node -e "const fs=require('fs'),h=fs.readFileSync('app/www/index.html','utf8');new Function(h.match(/<script>([\s\S]*)<\/script>/)[1])"

      - name: Regression tests
        run: |
          node --test tests/*.test.js
          python3 -m unittest discover -s tests -p 'test_release_version.py' -v

      - name: Resolve version
        id: ver
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$(python3 scripts/release_version.py)"
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          if git show-ref --verify --quiet "refs/tags/v${VERSION}"; then
            test "$(git rev-list -n 1 "v${VERSION}")" = "$SOURCE_COMMIT" || {
              echo "Version v${VERSION} already belongs to another commit" >&2
              exit 1
            }
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source_commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      - name: Build arm64 FPK
        run: VERSION="${{ steps.ver.outputs.version }}" bash ./build.sh arm

      - name: Build x86_64 FPK
        run: VERSION="${{ steps.ver.outputs.version }}" bash ./build.sh x86

      - name: Verify artifacts
        run: |
          ls -lh dist/
          test -s dist/fn-browser-arm64.fpk
          test -s dist/fn-browser-x86_64.fpk

      - name: Upload FPK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aurora-fpk-${{ steps.ver.outputs.version }}
          path: |
            dist/fn-browser-arm64.fpk
            dist/fn-browser-x86_64.fpk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Generate release notes
        run: python3 scripts/extract_changelog.py "${{ steps.ver.outputs.version }}" > RELEASE_NOTES.md

      - name: Publish GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          SOURCE_COMMIT: ${{ steps.ver.outputs.source_commit }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/tags/${TAG}:refs/tags/${TAG}"
            test "$(git rev-list -n 1 "$TAG")" = "$SOURCE_COMMIT" || {
              echo "Refusing to replace assets for another source commit" >&2
              exit 1
            }
            gh release upload "$TAG" dist/fn-browser-arm64.fpk dist/fn-browser-x86_64.fpk --clobber
            gh release edit "$TAG" --draft=false --latest --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" \
              --target "$SOURCE_COMMIT" \
              --title "极光浏览器 Aurora v${VERSION}" \
              --notes-file RELEASE_NOTES.md \
              --latest \
              dist/fn-browser-arm64.fpk \
              dist/fn-browser-x86_64.fpk
          fi

      - name: Update FnDepot fnpack.json
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/contents/fnpack.json?ref=main" > .fnpack-base.json
          ARM_SHA="$(sha256sum dist/fn-browser-arm64.fpk | awk '{print $1}')"
          ARM_SIZE="$(stat -c '%s' dist/fn-browser-arm64.fpk)"
          X86_SHA="$(sha256sum dist/fn-browser-x86_64.fpk | awk '{print $1}')"
          X86_SIZE="$(stat -c '%s' dist/fn-browser-x86_64.fpk)"
          CHANGELOG_TEXT="$(cat RELEASE_NOTES.md)"
          NOW_ISO="$(date -Iseconds)"
          python3 - "$VERSION" "$ARM_SHA" "$ARM_SIZE" "$X86_SHA" "$X86_SIZE" "$NOW_ISO" "$CHANGELOG_TEXT" <<'PY'
          import base64, json, os, sys
          ver, arm_sha, arm_size, x86_sha, x86_size, now_iso, changelog = sys.argv[1:8]
          with open('.fnpack-base.json', encoding='utf-8') as f:
              base = json.load(f)
          data = json.loads(base64.b64decode(base['content']))
          app = data['apps']['fn-browser']
          releases = app.setdefault('releases', {})
          repo = os.environ['GITHUB_REPOSITORY']
          releases[ver] = {
              'changelog': changelog.strip() or f'极光浏览器 Aurora v{ver}',
              'updated_at': now_iso,
              'packages': {
                  'arm': {
                      'download_url': f'https://github.com/{repo}/releases/download/v{ver}/fn-browser-arm64.fpk',
                      'sha256': arm_sha,
                      'size': int(arm_size),
                  },
                  'x86': {
                      'download_url': f'https://github.com/{repo}/releases/download/v{ver}/fn-browser-x86_64.fpk',
                      'sha256': x86_sha,
                      'size': int(x86_size),
                  },
              },
          }
          content = json.dumps(data, ensure_ascii=False, indent=2) + '\n'
          request = {
              'message': f'chore: update fnpack.json for v{ver} [skip ci]',
              'branch': 'main',
              'sha': base['sha'],
              'content': base64.b64encode(content.encode('utf-8')).decode('ascii'),
          }
          with open('.fnpack-update.json', 'w', encoding='utf-8') as f:
              json.dump(request, f)
          PY
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/fnpack.json" --input .fnpack-update.json > /dev/null
